name: build-macos

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: macOS arm64
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 环境信息
        run: |
          uname -m
          sw_vers
          python -V

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: PyInstaller 打包
        run: |
          python -m PyInstaller --noconfirm --clean --onefile \
            --name deepseek-qq \
            --add-data "config.example.yaml:." \
            --collect-data certifi \
            --collect-submodules app \
            --hidden-import aiohttp \
            --hidden-import yaml \
            --hidden-import certifi \
            main.py

      - name: 组装压缩包
        run: |
          cd dist
          cp ../config.example.yaml .
          cp ../start-mac.command .
          chmod +x deepseek-qq start-mac.command
          codesign --force --sign - deepseek-qq || true
          ARCH="$(uname -m)"
          zip -r "deepseek-qq-macos-${ARCH}.zip" deepseek-qq config.example.yaml start-mac.command
          ls -lh
          ./deepseek-qq --version

      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-qq-macos
          path: dist/deepseek-qq-macos-*.zip
          if-no-files-found: error
